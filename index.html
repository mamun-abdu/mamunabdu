  <style>
    :root {
      --gold-primary: #f5c452;
      --gold-glow: rgba(245, 196, 82, 0.45);
      --gold-border: rgba(245, 196, 82, 0.72);
      --card-glass: rgba(18, 12, 32, 0.44);
    }

    * {
      box-sizing: border-box;
      image-rendering: pixelated;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      background-color: #070312;
      color: #f7f3ec;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      overflow-x: hidden;
      overflow-y: auto;
    }

    .font-pixel {
      font-family: 'Press Start 2P', monospace;
    }

    .font-pixel-sub {
      font-family: 'Silkscreen', monospace;
    }

    /* Enhanced Cinematic Twilight Color Grading */
    .sky-gradient {
      background: radial-gradient(
        circle at 50% 85%,
        #3c1669 0%,
        #2a104f 35%,
        #190933 65%,
        #0a0417 90%,
        #05020c 100%
      );
    }

    /* True Glassmorphism Card: 44% opacity, warm amber rim lighting, clear voxel backdrop view */
    .glass-card {
      background: var(--card-glass);
      backdrop-filter: blur(18px) saturate(155%);
      -webkit-backdrop-filter: blur(18px) saturate(155%);
      border: 1.5px solid var(--gold-border);
      box-shadow: 
        0 0 0 1px rgba(8, 4, 16, 0.9),
        0 0 36px rgba(245, 196, 82, 0.2),
        0 18px 54px rgba(0, 0, 0, 0.7),
        0 36px 90px rgba(5, 2, 12, 0.9),
        inset 0 1.5px 1px rgba(255, 240, 205, 0.35),
        inset 0 -1.5px 1px rgba(0, 0, 0, 0.55);
      transition: border-color 0.35s ease, box-shadow 0.35s ease, transform 0.25s ease;
    }

    .glass-card:hover {
      border-color: rgba(245, 196, 82, 0.95);
      box-shadow: 
        0 0 0 1px rgba(10, 6, 20, 0.95),
        0 0 48px rgba(245, 196, 82, 0.3),
        0 22px 64px rgba(0, 0, 0, 0.75),
        0 40px 105px rgba(6, 2, 14, 0.95),
        inset 0 1.5px 1px rgba(255, 245, 220, 0.45),
        inset 0 -1.5px 1px rgba(0, 0, 0, 0.55);
    }

    /* Translucent Glass Avatar Frame with Gentle Ambient Pulse */
    .glass-avatar-frame {
      border: 1.5px solid rgba(245, 196, 82, 0.78);
      background: rgba(14, 18, 28, 0.68);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 
        0 0 0 1.5px rgba(6, 9, 16, 0.9),
        0 0 24px rgba(245, 196, 82, 0.25),
        0 8px 24px rgba(0, 0, 0, 0.65),
        inset 0 1px 1px rgba(255, 255, 255, 0.28);
      transition: box-shadow 0.3s ease, border-color 0.3s ease;
    }

    .glass-avatar-frame:hover {
      border-color: rgba(245, 196, 82, 0.95);
      box-shadow: 
        0 0 0 1.5px rgba(6, 9, 16, 0.95),
        0 0 30px rgba(245, 196, 82, 0.38),
        0 10px 28px rgba(0, 0, 0, 0.72),
        inset 0 1px 1px rgba(255, 255, 255, 0.35);
    }

    /* Tactile Pixel CTA Button */
    .pixel-cta-btn {
      background: #e6a832;
      color: #1a0f02;
      border: 2px solid #140800;
      box-shadow: 
        inset 2px 2px 0 #fff0be,
        inset -2px -2px 0 #9e5d03,
        0 4px 0 #100500,
        0 8px 20px rgba(0, 0, 0, 0.65);
      transition: transform 0.12s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.12s cubic-bezier(0.2, 0.8, 0.2, 1), background-color 0.15s ease;
      text-decoration: none;
      user-select: none;
    }

    .pixel-cta-btn:hover {
      background: #f4b63e;
      transform: translateY(-2px);
      box-shadow: 
        inset 2px 2px 0 #fff6cc,
        inset -2px -2px 0 #b26b05,
        0 6px 0 #100500,
        0 14px 24px rgba(0, 0, 0, 0.75),
        0 0 20px rgba(245, 196, 82, 0.35);
    }

    .pixel-cta-btn:active {
      transform: translateY(3px);
      box-shadow: 
        inset 2px 2px 0 #854802,
        inset -2px -2px 0 #fff0be,
        0 1px 0 #100500;
    }

    /* Natural Lantern Flame Flicker with Ambient Light Cone */
    @keyframes lanternGlow1 {
      0%, 100% { opacity: 0.98; filter: drop-shadow(0 0 16px rgba(245, 196, 82, 0.98)); }
      22% { opacity: 0.88; filter: drop-shadow(0 0 11px rgba(245, 196, 82, 0.78)); }
      26% { opacity: 0.62; filter: drop-shadow(0 0 6px rgba(245, 196, 82, 0.45)); }
      30% { opacity: 0.98; filter: drop-shadow(0 0 16px rgba(245, 196, 82, 0.98)); }
      64% { opacity: 0.95; }
      67% { opacity: 0.74; filter: drop-shadow(0 0 8px rgba(245, 196, 82, 0.58)); }
      71% { opacity: 0.96; filter: drop-shadow(0 0 14px rgba(245, 196, 82, 0.88)); }
    }

    @keyframes lanternGlow2 {
      0%, 100% { opacity: 0.94; filter: drop-shadow(0 0 13px rgba(245, 196, 82, 0.88)); }
      16% { opacity: 0.58; filter: drop-shadow(0 0 5px rgba(245, 196, 82, 0.4)); }
      19% { opacity: 0.96; filter: drop-shadow(0 0 13px rgba(245, 196, 82, 0.88)); }
      52% { opacity: 0.92; }
      55% { opacity: 0.68; filter: drop-shadow(0 0 7px rgba(245, 196, 82, 0.52)); }
      58% { opacity: 0.96; }
    }

    .lantern-pulse-1 {
      animation: lanternGlow1 4.8s infinite ease-in-out;
    }

    .lantern-pulse-2 {
      animation: lanternGlow2 6.2s infinite ease-in-out 0.8s;
    }

      0%, 100% { opacity: 0.16; }
      50% { opacity: 0.10; }
    }

    .light-cast {
      animation: lightConeBreathe 4.8s infinite ease-in-out;
    }

      0%, 100% { opacity: 1; filter: drop-shadow(0 0 4px #c084fc); }
      50% { opacity: 0.35; filter: drop-shadow(0 0 1px #a855f7); }
    }

    .ender-glow {
      animation: enderEyesPulse 3.6s infinite ease-in-out;
    }

    /* Circuit Trace Gentle Data Shimmer */
    @keyframes circuitShimmer {
      0%, 100% { opacity: 0.65; }
      50% { opacity: 0.95; }
    }

    .circuit-pulse {
      animation: circuitShimmer 5s infinite ease-in-out;
    }

    /* Multi-layered Pixel Cloud Drift */
    @keyframes cloudDrift1 {
      0% { transform: translateX(-30%); }
      100% { transform: translateX(130%); }
    }

    @keyframes cloudDrift2 {
      0% { transform: translateX(-20%); }
      100% { transform: translateX(140%); }
    }

    .cloud-slow-1 {
      animation: cloudDrift1 150s linear infinite;
      will-change: transform;
    }

    .cloud-slow-2 {
      animation: cloudDrift2 210s linear infinite -60s;
      will-change: transform;
    }

    /* Parallax Layer Transitions */
    .parallax-plane {
      transition: transform 0.22s cubic-bezier(0.12, 0.45, 0.2, 1);

        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
      .parallax-plane {
        transform: none !important;
      }
    }

  <!-- ================================================================= -->
  <!-- CLIENT SCRIPT: Dynamic Starfield, Ambient Embers & Parallax       -->
  <!-- ================================================================= -->
  <script>
    (function () {
      'use strict';

      // 1. Procedural Celestial Canvas: Twinkling Square Stars & Floating Warm Embers
      const canvas = document.getElementById('skyCanvas');
      const ctx = canvas.getContext('2d');
      let width = 0;
      let height = 0;
      const stars = [];
      const embers = [];

      function setupCanvas() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;

        // Twinkling Minecraft night stars
        stars.length = 0;
        const starCount = Math.floor(Math.min(width, 1400) / 24);
        for (let i = 0; i < starCount; i++) {
          stars.push({
            x: Math.random() * width,
            y: Math.random() * (height * 0.72),
            size: Math.random() > 0.82 ? 2 : 1,
            speed: 0.7 + Math.random() * 1.6,
            phase: Math.random() * Math.PI * 2
          });
        }

        // Ambient floating embers (warm amber & twilight violet dust)
        embers.length = 0;
        const emberCount = 18;
        for (let i = 0; i < emberCount; i++) {
          embers.push({
            x: Math.random() * width,
            y: height * 0.35 + Math.random() * (height * 0.6),
            size: Math.random() > 0.65 ? 2 : 1.5,
            vy: -(0.2 + Math.random() * 0.28),
            vx: (Math.random() - 0.5) * 0.16,
            opacity: 0.25 + Math.random() * 0.4,
            color: Math.random() > 0.32 ? '245, 196, 82' : '205, 155, 255'
          });
        }
      }

      function render() {
        ctx.clearRect(0, 0, width, height);
        const now = Date.now() * 0.001;

        // Twinkling square stars
        for (let i = 0; i < stars.length; i++) {
          const s = stars[i];
          const brightness = 0.25 + 0.68 * (0.5 + 0.5 * Math.sin(now * s.speed + s.phase));
          ctx.fillStyle = 'rgba(244, 235, 255, ' + brightness + ')';
          ctx.fillRect(Math.floor(s.x), Math.floor(s.y), s.size, s.size);
        }

        // Floating ambient embers
        for (let i = 0; i < embers.length; i++) {
          const e = embers[i];
          e.y += e.vy;
          e.x += e.vx;

          if (e.y < height * 0.1) {
            e.y = height * 0.9;
            e.x = Math.random() * width;
          }

          ctx.fillStyle = 'rgba(' + e.color + ', ' + e.opacity + ')';
          ctx.fillRect(Math.floor(e.x), Math.floor(e.y), e.size, e.size);
        }

        requestAnimationFrame(render);
      }

      const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)');
      if (!prefersReduced.matches) {
        setupCanvas();
        render();
      } else {
        setupCanvas();
        ctx.clearRect(0, 0, width, height);
        for (let i = 0; i < stars.length; i++) {
          const s = stars[i];
          ctx.fillStyle = 'rgba(244, 235, 255, 0.45)';
          ctx.fillRect(Math.floor(s.x), Math.floor(s.y), s.size, s.size);
        }
      }

      // 2. Gentle Desktop Parallax (Smooth & subtle, disabled on touch/mobile)
      const midLayer = document.getElementById('midgroundLayer');
      const foreLayer = document.getElementById('foregroundLayer');

      if (!prefersReduced.matches && window.matchMedia('(pointer: fine)').matches) {
        let mouseX = 0;
        let targetX = 0;

        window.addEventListener('mousemove', function (e) {
          targetX = (e.clientX / window.innerWidth) * 2 - 1;
        }, { passive: true });

        function updateParallax() {
          mouseX += (targetX - mouseX) * 0.04;
          if (midLayer) midLayer.style.transform = 'translate3d(' + (mouseX * -9) + 'px, 0, 0)';
          if (foreLayer) foreLayer.style.transform = 'translate3d(' + (mouseX * -16) + 'px, 0, 0)';
          requestAnimationFrame(updateParallax);
        }
        updateParallax();
      }

      // Debounced resize
      let resizeTimeout;
      window.addEventListener('resize', function () {
        clearTimeout(resizeTimeout);
        resizeTimeout = setTimeout(setupCanvas, 150);
      }, { passive: true });

    })();
  </script>
